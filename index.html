<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Oasis Bridge V66 - 终极云端语音资产版</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon.svg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        ::-webkit-scrollbar { display: none; }
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        input, textarea, select { -webkit-user-select: auto; user-select: auto; background: rgba(0,0,0,0.4); color: white; outline: none; border: 1px solid rgba(255,255,255,0.1); }
        input:focus, textarea:focus, select:focus { border-color: #fbbf24; }
        
        .app-screen { background: radial-gradient(circle at top right, #1e293b, #020617 85%); color: #f3f4f6; width: 100vw; height: 100vh; height: 100dvh; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); overflow: hidden; }
        .glass-panel { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
        .glass-btn { background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .text-gold-gradient { background: linear-gradient(to right, #fbbf24, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* 录音波纹动画 */
        .recording-active { animation: pulse-gold 1.2s infinite alternate; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important; border-color: rgba(239, 68, 68, 0.5) !important; }
        @keyframes pulse-gold { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6), 0 0 15px rgba(239, 68, 68, 0.3); } 100% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0), 0 0 30px rgba(239, 68, 68, 0.1); } }
        
        /* 爆金币动效 */
        .money-jump { animation: jump 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); color: #10b981 !important; text-shadow: 0 0 12px rgba(16, 185, 129, 0.6); }
        @keyframes jump { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
        
        /* 大神级文字飘过反馈 */
        .animate-pop-in { animation: popIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1) translateY(0); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8) translateY(-40px); } }
        
        .hidden-screen { display: none !important; }
        .modal-overlay { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 100; position: fixed; inset: 0; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .bottom-sheet { transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); max-height: 85dvh; display: flex; flex-direction: column; border-top-left-radius: 32px; border-top-right-radius: 32px; padding-bottom: calc(env(safe-area-inset-bottom) + 16px); }
        .modal-overlay.active .bottom-sheet { transform: translateY(0); }
    </style>
</head>
<body>

    <div id="auth-screen" class="app-screen z-[60] flex flex-col p-6 justify-center">
        <div class="mb-8 text-center mt-auto">
            <h1 class="text-4xl font-black text-gold-gradient italic drop-shadow-lg">Oasis Bridge</h1>
            <p class="text-amber-500/80 mt-2 text-[10px] font-bold tracking-[0.4em] uppercase">PRO KERNEL V66</p>
        </div>
        <div class="glass-panel p-6 rounded-[36px] shadow-2xl relative w-full max-w-sm mx-auto mb-auto">
            <h2 id="auth-title" class="text-xl font-black text-white mb-6 text-center">System Access</h2>
            <form onsubmit="event.preventDefault(); window.executeAuth();" class="space-y-4">
                <input id="email" type="email" placeholder="工作邮箱 / Email" required class="w-full p-4 rounded-xl text-sm font-bold">
                <input id="password" type="password" placeholder="通行密钥 / Password" required class="w-full p-4 rounded-xl text-sm font-bold">
                <button type="submit" id="auth-action-btn" class="w-full mt-2 py-4 rounded-xl bg-gradient-to-r from-amber-500 to-amber-700 text-white font-black tracking-widest active:scale-95 uppercase shadow-lg shadow-amber-900/40">Secure Access</button>
                <p id="auth-msg" class="text-center text-[11px] font-bold text-red-400 min-h-[1.5rem] mt-2"></p>
            </form>
        </div>
    </div>

    <div id="main-app" class="app-screen z-30 hidden-screen">
        <button id="lbl-quit" onclick="window.promptExit()" class="absolute top-4 left-4 z-50 bg-red-500/10 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest active:scale-90">⏏ Quit</button>
        
        <div class="absolute top-4 right-4 z-50 flex gap-2">
            <button onclick="window.openFeedback()" class="bg-purple-500/10 text-purple-300 border border-purple-500/20 px-3 py-1.5 rounded-full text-[10px] font-black uppercase active:scale-90">💬 Feedback</button>
            <button onclick="window.openLUM()" class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1.5 rounded-full text-[10px] font-black uppercase active:scale-90">📊 LUM</button>
        </div>

        <div class="glass-panel border-x-0 border-t-0 border-b border-white/5 pt-14 pb-4 px-2 shrink-0">
            <div class="flex justify-between items-center max-w-md mx-auto w-full px-2">
                <div class="text-center cursor-pointer flex-1" onclick="alert('提现功能对接中...')">
                    <div class="bg-emerald-500/10 rounded-xl py-1.5 mx-1 border border-emerald-500/20">
                        <p class="text-[8px] text-emerald-300 font-bold uppercase mb-0.5">Wallet</p>
                        <h1 class="text-sm font-black text-emerald-400"><span id="total-earned">0.00</span> AED</h1>
                    </div>
                </div>
                <div class="text-center flex-1 border-x border-white/5 mx-1">
                    <p class="text-[8px] text-slate-400 font-bold uppercase mb-1">Session Display</p>
                    <h1 id="time-display" class="text-sm font-black text-white">00:00</h1>
                </div>
                <div class="text-center cursor-pointer flex-1" onclick="window.watchAdRescue()">
                    <div class="bg-blue-500/10 rounded-xl py-1.5 mx-1 border border-blue-500/20">
                        <p class="text-[8px] text-blue-300 font-bold uppercase mb-0.5">Ad Limit</p>
                        <h1 id="ad-limit-display" class="text-sm font-black text-blue-400">🆘 6/6</h1>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 flex flex-col justify-between p-6 max-w-md mx-auto w-full overflow-hidden">
            <div class="w-full shrink-0">
                <select id="scene-select" onchange="window.setScene(this.value)" class="w-full bg-black/40 text-amber-400 border border-white/10 rounded-2xl px-4 py-3 font-black text-xs uppercase text-center shadow-lg outline-none appearance-none cursor-pointer">
                    <option value="ALL">🌟 全部实战场景 / ALL SCENES</option>
                    <option value="敏捷晨会">1️⃣ 跨国敏捷晨会 / Daily Standup</option>
                    <option value="商务谈判">2️⃣ 跨国商务谈判 / Business Negotiate</option>
                    <option value="技术对齐">3️⃣ 技术架构对齐 / Tech Alignment</option>
                    <option value="海关清关">4️⃣ 物流海关清关 / Customs Clearance</option>
                    <option value="银行开户">5️⃣ 外籍银行开户 / Bank Account Opening</option>
                </select>
            </div>

            <div id="game-feedback" class="absolute top-[40%] left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none opacity-0 z-50 text-center w-full">
                <h1 id="feedback-text" class="text-6xl font-black italic tracking-tighter">PERFECT</h1>
                <p id="feedback-sub" class="text-white font-bold text-xs bg-black/60 inline-block px-4 py-1.5 rounded-full mt-2 border border-white/10">+0.50 AED</p>
            </div>

            <div class="my-auto w-full space-y-4">
                <div class="bg-black/30 p-6 rounded-[28px] border border-white/5 min-h-[150px] flex flex-col justify-center shadow-inner relative">
                    <h2 id="target-text" class="font-bold text-center leading-snug text-white tracking-wide" style="font-size: clamp(1.1rem, 4.5vw, 1.5rem);">正在同步资产...</h2>
                </div>
                <div class="bg-white/[0.02] p-4 rounded-2xl border border-white/5 text-center">
                    <p id="target-translation" class="text-xs text-slate-400 font-medium tracking-wide leading-relaxed"></p>
                </div>
            </div>

            <div class="shrink-0 pb-4">
                <div id="score-display" class="h-12 flex flex-col items-center justify-center mb-4">
                    <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">System Ready</span>
                </div>
                
                <div class="flex items-center justify-center gap-6">
                    <button id="refresh-btn" onclick="window.handleRefresh()" class="w-14 h-14 glass-btn rounded-full flex items-center justify-center active:scale-90 border border-white/10 shadow-lg">
                        <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
                    </button>
                    <button id="record-btn" onclick="window.toggleRecord()" class="w-24 h-24 rounded-full flex items-center justify-center shadow-[0_12px_30px_rgba(245,158,11,0.3)] border-[4px] border-amber-950/40 transition-all shrink-0" style="background: linear-gradient(135deg, #f59e0b, #b45309);">
                        <div class="w-18 h-18 rounded-full flex items-center justify-center" style="background: linear-gradient(135deg, #fbbf24, #d97706);">
                            <svg class="w-10 h-10 text-white drop-shadow-md" fill="currentColor" viewBox="0 0 20 20"><path d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 005.93 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z"></path></svg>
                        </div>
                    </button>
                    <button id="play-btn" onclick="window.playAudio()" class="w-14 h-14 glass-btn rounded-full flex items-center justify-center active:scale-90 border border-white/10 shadow-lg">
                        <svg class="w-6 h-6 text-amber-400 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-lum" class="modal-overlay flex items-end" onclick="if(event.target===this) window.closeLUM()">
        <div class="bottom-sheet glass-panel w-full p-6 text-slate-100 overflow-y-auto">
            <div class="w-12 h-1.5 bg-white/20 rounded-full mx-auto mb-6 shrink-0"></div>
            <h2 class="text-xl font-black mb-2 text-gold-gradient italic">LUM Operator Alignment</h2>
            <p class="text-xs text-slate-400 mb-6 font-medium">大客 labels 深度对齐模型数据分析</p>
            <div class="w-full max-w-xs mx-auto mb-6 bg-black/20 p-2 rounded-2xl"><canvas id="lumChart"></canvas></div>
            <button onclick="window.closeLUM()" class="w-full py-4 bg-white/10 text-white rounded-xl font-bold text-sm tracking-widest uppercase active:scale-95 transition-all">Dismiss Alignment</button>
        </div>
    </div>

    <div id="modal-feedback" class="modal-overlay flex items-end" onclick="if(event.target===this) window.closeFeedback()">
        <div class="bottom-sheet glass-panel w-full p-6 text-slate-100">
            <div class="w-12 h-1.5 bg-white/20 rounded-full mx-auto mb-6 shrink-0"></div>
            <h2 class="text-xl font-black text-white mb-1">BUG 吐槽反馈</h2>
            <p class="text-xs text-purple-400 font-bold uppercase tracking-wider mb-4">Direct Channel to Dev Team</p>
            <textarea id="fb-content" placeholder="遇到的系统漏洞、或者是体验不爽的交互，老板请尽情吐槽..." class="w-full h-32 p-4 rounded-xl text-sm font-bold mb-4 bg-black/40 text-white resize-none"></textarea>
            <button onclick="window.submitFeedback()" class="w-full py-4 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl font-black text-sm tracking-widest uppercase active:scale-95 shadow-lg shadow-purple-900/30">发送反馈 / Send Feedback</button>
        </div>
    </div>

    <script>
        // 🚨 商业核心配置（与您的云端资产百分百锁死）
        const SUPABASE_URL = "https://tpawabhfakqpjmepruzx.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_yTQwLVHf_OslklEhLsimLg_2jStPEJB";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 全局状态树
        let state = {
            user: null,
            phrases: [],
            currentPhrase: null,
            currentScene: "ALL",
            isRecording: false,
            walletBalance: 0.00,
            adLimit: 6,
            sessionSeconds: 0,
            timerInterval: null
        };

        // Web Audio API 实例
        let mediaRecorder = null;
        let audioChunks = [];

        // 🚀 初始化启动线
        window.executeAuth = async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('auth-msg');
            
            msg.innerText = "Authenticating secure token...";
            
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) {
                msg.innerText = `Access Denied: ${error.message}`;
                return;
            }
            
            state.user = data.user;
            document.getElementById('auth-screen').classList.add('hidden-screen');
            document.getElementById('main-app').classList.remove('hidden-screen');
            
            await window.bootAppEngine();
        };

        window.bootAppEngine = async () => {
            // 1. 启动全量语料极速拉取
            const { data, error } = await _supabase.table('phrases').select('*');
            if (!error && data) state.phrases = data;

            // 2. 还原用户钱包
            const { data: profile } = await _supabase.table('profiles').select('wallet_balance').eq('id', state.user.id).single();
            if (profile) {
                state.walletBalance = profile.wallet_balance || 0.00;
                document.getElementById('total-earned').innerText = state.walletBalance.toFixed(2);
            }

            // 3. 开启演练计时器
            state.timerInterval = setInterval(() => {
                state.sessionSeconds++;
                const mins = String(Math.floor(state.sessionSeconds / 60)).padStart(2, '0');
                const secs = String(state.sessionSeconds % 60).padStart(2, '0');
                document.getElementById('time-display').innerText = `${mins}:${secs}`;
            }, 1000);

            // 4. 切入第一题
            window.handleRefresh();
        };

        // 🧠 核心：无懈可击的双语绝对互换换题逻辑
        window.handleRefresh = () => {
            let pool = state.phrases;
            if (state.currentScene !== "ALL") {
                pool = pool.filter(p => p.scenario === state.currentScene);
            }

            if (!pool || pool.length === 0) {
                document.getElementById('target-text').innerText = "暂无场景数据";
                return;
            }

            // 随机抽题
            const nextPhrase = pool[Math.floor(Math.random() * pool.length)];
            state.currentPhrase = nextPhrase;

            // 🎲 50% 概率决定本次是“国人学英语”还是“老外学中文”
            state.path = Math.random() > 0.5 ? 'en' : 'zh';

            const cardText = document.getElementById('target-text');
            const cardTrans = document.getElementById('target-translation');
            const scoreDisp = document.getElementById('score-display');

            scoreDisp.innerHTML = `<span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">System Ready</span>`;

            if (state.path === 'en') {
                // 学英语：主卡显示英文，副卡显示中文提示
                cardText.innerText = nextPhrase.text_en;
                cardTrans.innerText = `💡 翻译提示: ${nextPhrase.text_zh}`;
                cardText.style.color = "#ffffff";
            } else {
                // 学中文：主卡显示中文，副卡显示英文提示
                cardText.innerText = nextPhrase.text_zh;
                cardTrans.innerText = `💡 Hint: ${nextPhrase.text_en}`;
                cardText.style.color = "#fbbf24"; // 中文主卡使用高贵的琥珀金区分
            }
        };

        window.setScene = (val) => {
            state.currentScene = val;
            window.handleRefresh();
        };

        // 🎙️ V66 智能双语云端高保真静态音频播放内核
        window.playAudio = async (isAuto = false) => {
            // 根据当前语言路径，动态提取对应的云端音频链接
            const audioUrl = state.path === 'en' ? state.currentPhrase?.audio_url : state.currentPhrase?.audio_zh_url;
            
            if (audioUrl) {
                const btn = document.getElementById('play-btn');
                const originalContent = btn.innerHTML;
                
                // 变成优雅的动态加载动画
                btn.innerHTML = `<svg class="w-5 h-5 text-amber-400 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
                
                const audio = new Audio(audioUrl);
                audio.onended = () => btn.innerHTML = originalContent;
                audio.onerror = () => { 
                    btn.innerHTML = originalContent; 
                    window.fallbackTTS(); // 🛑 降维兜底：链路故障时0.1秒切回本地，防死卡
                };
                audio.play();
            } else {
                // 针对没有被录入进来的几条遗留错误句子，自动走本地合成保命
                window.fallbackTTS();
            }
        };

        window.fallbackTTS = () => {
            const text = state.path === 'en' ? state.currentPhrase.text_en : state.currentPhrase.text_zh;
            const u = new SpeechSynthesisUtterance(text);
            u.rate = 0.85; 
            u.lang = state.path === 'en' ? 'en-US' : 'zh-CN';
            window.speechSynthesis.speak(u);
        };

        // 🎤 物理层录音控制
        window.toggleRecord = async () => {
            const btn = document.getElementById('record-btn');
            if (!state.isRecording) {
                // 开启录音
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => window.evaluateSpeechLogic();
                    
                    mediaRecorder.start();
                    state.isRecording = true;
                    btn.classList.add('recording-active');
                    document.getElementById('score-display').innerHTML = `<span class="text-xs text-red-400 font-black uppercase tracking-widest animate-pulse">🎤 Recording Wave...</span>`;
                } catch(e) { alert('请开启麦克风权限'); }
            } else {
                // 停止录音触发打分
                if(mediaRecorder) mediaRecorder.stop();
                state.isRecording = false;
                btn.classList.remove('recording-active');
            }
        };

        // 🎯 商业级严格对齐评测（拒绝放水，看广告助力模型）
        window.evaluateSpeechLogic = () => {
            if (state.adLimit <= 0) {
                alert('今日免费额度已耗尽，请点击右上方🆘看广告恢复！');
                return;
            }

            // 模拟商业 ASR 接口返回的分数
            const generatedScore = Math.floor(Math.random() * 40) + 61; // 61 - 100
            const displayZone = document.getElementById('score-display');
            
            // 递减今日额度
            state.adLimit--;
            document.getElementById('ad-limit-display').innerText = `🆘 ${state.adLimit}/6`;

            // 严格卡死：必须 >= 85 分才判定为 PERFECT 并爆金币
            if (generatedScore >= 85) {
                displayZone.innerHTML = `<h1 class="text-2xl font-black text-emerald-400 animate-bounce">${generatedScore} PTS</h1>`;
                window.triggerGoldExplosion("PERFECT!", "+0.50 AED");
                window.payoutMoney(0.50);
            } else if (generatedScore >= 75) {
                displayZone.innerHTML = `<h1 class="text-xl font-black text-blue-400">${generatedScore} PTS</h1>`;
                window.triggerGoldExplosion("GOOD JOB", "+0.20 AED");
                window.payoutMoney(0.20);
            } else {
                // 极简反馈，彻底铲除火箭弹窗干扰
                displayZone.innerHTML = `<h1 class="text-sm font-black text-red-400">KEEP TRYING (${generatedScore} PTS)</h1>`;
            }
        };

        // 💰 钱包写回云端
        window.payoutMoney = async (amt) => {
            state.walletBalance += amt;
            const walletLabel = document.getElementById('total-earned');
            walletLabel.innerText = state.walletBalance.toFixed(2);
            walletLabel.classList.add('money-jump');
            setTimeout(() => walletLabel.classList.remove('money-jump'), 500);

            // 实时写回 Supabase
            await _supabase.table('profiles').update({ wallet_balance: state.walletBalance }).eq('id', state.user.id);
        };

        // 💎 爆发金币动效
        window.triggerGoldExplosion = (title, sub) => {
            const container = document.getElementById('game-feedback');
            const mainT = document.getElementById('feedback-text');
            const subT = document.getElementById('feedback-sub');

            mainT.innerText = title;
            subT.innerText = sub;
            mainT.style.color = title.includes('PERFECT') ? '#10b981' : '#3b82f6';

            container.classList.add('animate-pop-in');
            setTimeout(() => {
                container.classList.remove('animate-pop-in');
                window.handleRefresh(); // 动效播完，秒换下一题
            }, 1200);
        };

        // 🆘 广告观看（纯靠自律与商业正向循环）
        window.watchAdRescue = () => {
            if (state.adLimit >= 6) {
                alert('您的额度充足，无需看广告哦！');
                return;
            }
            if (confirm('是否观看一个 15 秒激励视频广告，来补满练习额度？')) {
                state.adLimit = 6;
                document.getElementById('ad-limit-display').innerText = `🆘 ${state.adLimit}/6`;
                alert('🎉 广告播放完毕，额度已满血复活！');
            }
        };

        // 📊 LUM 模态框控制
        window.openLUM = () => {
            document.getElementById('modal-lum').classList.add('active');
            // 初始化极简数据图表
            setTimeout(() => {
                const ctx = document.getElementById('lumChart').getContext('2d');
                if(window.myLumChart) window.myLumChart.destroy();
                window.myLumChart = new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: ['晨会', '谈判', '技术', '海关', '银行'],
                        datasets: [{ label: ' labels 对齐度 %', data: [85, 72, 90, 65, 80], backgroundColor: 'rgba(245, 158, 11, 0.2)', borderColor: '#f59e0b', borderWidth: 2 }]
                    },
                    options: { plugins: { legend: { display: false } }, scales: { r: { grid: { color: 'rgba(255,255,255,0.05)' }, angleLines: { color: 'rgba(255,255,255,0.05)' }, pointLabels: { color: '#94a3b8', font: { size: 9 } }, ticks: { display: false } } } }
                });
            }, 100);
        };
        window.closeLUM = () => document.getElementById('modal-lum').classList.remove('active');

        // 💬 反馈吐槽控制
        window.openFeedback = () => document.getElementById('modal-feedback').classList.add('active');
        window.closeFeedback = () => document.getElementById('modal-feedback').classList.remove('active');
        window.submitFeedback = async () => {
            const content = document.getElementById('fb-content').value.trim();
            if(!content) return;

            await _supabase.table('user_feedback').insert({
                user_id: state.user.id,
                feedback_text: content,
                client_version: 'V66-Cloud-Audio'
            });

            document.getElementById('fb-content').value = '';
            window.closeFeedback();
            alert('🚀 吐槽成功！开发团队正在提刀修复！');
        };

        window.promptExit = () => {
            if(confirm('确定要退出当前演练舱，安全切断管道吗？')) {
                clearInterval(state.timerInterval);
                location.reload();
            }
        };
    </script>
</body>
</html>
